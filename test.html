<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>WebSocket Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        canvas {
            top: 0;
            left: 0;
            position: absolute;
        }

<body>
    <canvas id="lala"></canvas>

    <script type="text/javascript">
        let testMessage = "0:true:97,70;1:true:23,90";
        let init = false;
        const user = {
            agent: null
        };

        let wsocket;

        window.buffer = {
            current: "",
            real: "",
            next: function () {
                this.current = this.real;
                this.real = "";
            }
        }

        //test code
        // buffer.real = testMessage;
        // buffer.next();


        window.agents = [];

        for(let i = 0; i < 50; i++) {
            window.agents.push({x:0, y:0})
        }

        function connect() {


            wsocket = new WebSocket("ws://localhost:8000");
            wsocket.onopen = onopen;
            wsocket.onmessage = onmessage;
            wsocket.onclose = onclose;

        }

        function onopen() {
            console.log("Connected!");
        }

        function onmessage(event) {
            try{
                let x = event.data;
                const i = x.lastIndexOf("}") + 1;
                x = x.substring(0, i);

                const msg = JSON.parse(x);
                if (msg.datatype === "state") {
                    buffer.real = msg.data;
                    return
                }
                if (msg.datatype === "init") {
                    user.agent = Number(msg.id);
                    return
                }

                console.warn("unsupported datatype", msg.datatype)
            } catch (e) {
                console.error(e);
                console.log(event.data);
            }
        }

        function onclose(e) {
            console.log("Connection closed.");
        }

        window.addEventListener("load", connect, false);

        function move(direction) {
            wsocket.send(JSON.stringify({
                datatype: "move",
                direction: direction
            }))
        }

        window.addEventListener("keydown", function (event) {
            setTimeout(() => {
                switch (event.key) {
                    case "w":
                        move(1);
                        break
                    case "d":
                        move(3);
                        break
                    case "a":
                        move(7);
                        break
                    case "s":
                        move(5);
                        break
                }
            }, 1000);
            //Todo make server move user on message
        })
    </script>
    <script>
        const canvas = document.getElementById("lala");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const ctx = canvas.getContext("2d");

        function frame() {
            draw();
            requestAnimationFrame(frame);
        }
        frame();

        function draw() {
            ctx.clearRect(0 ,0 ,canvas.width ,canvas.height);
            ctx.beginPath();

            //creates rectangle (boarders) for agents
            ctx.strokeStyle = "orange";
            ctx.strokeRect(199, 199, 1_201, 601);

            buffer.next();
            const message =  buffer.current;

            if(message == "") {
                console.log("empty")

                return;
            }

            for(const line of message.split(";")) {
                console.log(line);
                if(line.indexOf(":") === -1) {
                    console.log("Continue")
                    continue
                }
                const arr = line.split(":");
                console.log(arr);
                const id = Number(arr[0]);
                const alive = Boolean(arr[1]);
                const coordinates = (arr[2].split(","));
                const agent = window.agents[id];

                agent.x = Number((coordinates[0]) / 10) + 200;
                agent.y = Number((coordinates[1]) / 10) + 200;

                ctx.fillStyle = "#000000";
                if(id == user.agent) {
                    ctx.fillStyle = "#fd0101";
                }

                ctx.fillRect(agent.x, agent.y, 5, 5);
                ctx.fill();
            }
        }
        //Todo make agents move in the specific aria of the canvas

    </script>
