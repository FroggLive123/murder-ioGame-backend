<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>WebSocket Client</title>

    <button id="btnMove">Move</button>
    <canvas id="lala"></canvas>

    <script type="text/javascript">

        var wsocket;

        window.buffer = {
            current: "",
            real: "",
            next: function () {
                this.current = this.real;
            }
        }

        window.agents = [];

        for(let i = 0; i < 50; i++) {
            window.agents.push({x:0, y:0})
        }

        function connect() {


            wsocket = new WebSocket("ws://localhost:8000");
            wsocket.onopen = onopen;
            wsocket.onmessage = onmessage;
            wsocket.onclose = onclose;

        }

        function onopen() {
            console.log("Connected!");
        }

        function onmessage(event) {
            buffer.real = event.data;
            console.log(event.data);
        }

        function onclose(e) {
            console.log("Connection closed.");
        }

        window.addEventListener("load", connect, false);

        var btnMove = document.getElementById("btnMove");
        btnMove.addEventListener("click", function (){
            console.log("Move command")
            wsocket.send(JSON.stringify({
                datatype: "move",
                direction: 1
            }))
        });


    </script>
    <script>
        const canvas = document.getElementById("lala");
        canvas.width = 1024;
        canvas.height = 768;
        const ctx = canvas.getContext("2d");

        function frame() {
            draw();
            requestAnimationFrame(frame);
        }

        frame();

        function draw() {
            ctx.clearRect(0 ,0 ,canvas.width ,canvas.height);

            const message =  buffer.current;

            if(message == "") {
                return
            }

            for(const line of message.split(";")) {
                const arr = line.split(":");
                const id = Number(arr[0]);
                const alive = Boolean(arr[1]);
                const coordinates = (arr[2].split(","));
                const agent = window.agents[id];

                agent.x = Number(coordinates[0]);
                agent.y = Number(coordinates[1]);

                ctx.fillStyle = "#000000";
                ctx.fillRect(agent.x, agent.y, 20, 20);
                ctx.fill();
            }

            buffer.next();
        }
    </script>
</head>

</body>
</html>
