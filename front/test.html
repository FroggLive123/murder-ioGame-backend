<body>
    <canvas id="lala"></canvas>

    <script type="text/javascript">
        window.buffer = {
            current: "",
            real: "",
            n: 0,
            next: function () {
                this.current = this.real;
                this.real = "";
                this.n = 0;
            }
        }

        let testMessage = "0:true:0,0;1:true:0,12000;2:true:6000,0;3:true:6000,12000;";
        let init = false;
        const user = {
            agent: null
        };

        let wsocket;

        const wsWorker = new SharedWorker("wsSharedWorker.js");
        wsWorker.port.start();
        wsWorker.port.addEventListener("message", function (e) {
            let message = JSON.parse(e.data);
            if(message.datatype === "init") {
                user.agent = message.id;
                return
            }
            if(message.datatype === "state") {
                buffer.n = 1;
                buffer.real = message.data;
            }
        })
        //Todo make buffer work

        // test code
        // buffer.real = testMessage;
        // buffer.next();


        window.agents = [];

        for(let i = 0; i < 50; i++) {
            window.agents.push({x:0, y:0})
        }

        function move(direction) {
            wsocket.send(JSON.stringify({
                datatype: "move",
                direction: direction
            }))
        }
            // buffer.real = `0:true:${x},${y}`;


        window.addEventListener("keydown", function (event) {
            switch (event.key) {
                    case "w":
                        move(1);
                        break
                    case "d":
                        move(3);
                        break
                    case "a":
                        move(7);
                        break
                    case "s":
                        move(5);
                        break
                }
            //Todo make server move user on message
        })
    </script>
    <script>
        const canvas = document.getElementById("lala");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const playingField = {
            width: canvas.width * 0.6,
            height: canvas.height * 0.6,
            x: (canvas.width - canvas.width * 0.6 ) / 2,
            y: (canvas.height - canvas.height * 0.6 ) / 2,
        }

        const ctx = canvas.getContext("2d");

        function frame() {
            draw();
            requestAnimationFrame(frame);
        }
        frame();

        function draw() {
            if(user.agent == null) {
                return;
            }

            if(buffer.n == 0) {
                return;
            }

            ctx.clearRect(0 ,0 ,canvas.width ,canvas.height);
            ctx.beginPath();

            buffer.next();
            const message =  buffer.current;
            // console.log(message);

            if(message == "") {
                return;
            }

            window.agents[user.agent].x = 1;
            window.agents[user.agent].y = 1;
            const globalOffset =  {
                // x: -window.agents[user.agent].x + window.innerWidth * 0.5,
                // y: -window.agents[user.agent].y + window.innerHeight * 0.5
                x: (-1 * window.agents[user.agent].x) + (canvas.innerWidth * 0.5),
                y: (-1 * window.agents[user.agent].y) + (canvas.innerHeight * 0.5)
            }
            // console.log(globalOffset.x, " ", globalOffset.y);
            // console.log(window.innerWidth * 0.5, " ", window.innerHeight * 0.5," id:", user.agent);

            for(const line of message.split(";")) {
                if(line.indexOf(":") === -1) {
                    continue
                }
                const arr = line.split(":");
                const id = Number(arr[0]);
                const alive = Boolean(arr[1]);
                const coordinates = (arr[2].split(","));
                const agent = window.agents[id];

                // agent.x = Number(((coordinates[0]) ) + playingField.x);
                // agent.y = Number(((coordinates[1]) ) + playingField.y);
                agent.x = Number(coordinates[0]);
                agent.y = Number(coordinates[1]);

                ctx.fillStyle = "#000000";
                if(id == user.agent) {
                    ctx.fillStyle = "#fd0101";
                }

                ctx.fillRect(agent.x, agent.y, 5, 5);
                ctx.fill();
            }
        }
        //Todo move
        //Todo kill
        //Todo main character have to be in the center without jumps
    </script>
